name: CI/CD Pipeline for deployment nodejs application on openshift cluster

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:latest

  deploy-to-openshift:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenShift CLI (oc)
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Log in to OpenShift and Deploy
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}
          
          sed -i "s|DOCKER_IMAGE|docker.io/${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:latest|g" k8s/deployment.yaml
          
          oc apply -f k8s/
          
          oc get route portfolio-website || oc expose svc/portfolio-website
          
          oc rollout restart deployment/portfolio-website
          

