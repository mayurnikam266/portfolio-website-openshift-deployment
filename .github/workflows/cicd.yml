name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:latest

  deploy-to-openshift:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenShift CLI (oc)
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Log in to OpenShift and Deploy
        run: |
          oc login --token=sha256~NUgwauaJ8ClGBnzO1azSiLMYTp55c1jmk1EsZHQ5UTI --server=https://api.rm1.0a51.p1.openshiftapps.com:6443
          oc import-image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:latest --confirm
          

