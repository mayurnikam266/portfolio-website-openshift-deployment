name: Beginner Friendly CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Upload to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # github.sha generates a unique tag based on the commit ID
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:${{ github.sha }}

  deploy:
    name: Deploy to OpenShift
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Log in to OpenShift Cloud
        run: oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Inject Secrets into YAML
        run: |
          # GitHub Actions cannot directly read secrets written inside a .yaml file.
          # So we use 'sed' to inject the GitHub Secret and the Commit SHA into the file.
          sed -i "s|DOCKER_IMAGE|docker.io/${{ secrets.DOCKERHUB_USERNAME }}/portfolio-website:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes Files
        run: |
          # Because the image tag is now unique per build, OpenShift detects the change
          # and automatically rolls out the update.
          oc apply -f k8s/

      - name: Create Public Route
        run: |
          oc get route portfolio-website || oc expose svc/portfolio-website
